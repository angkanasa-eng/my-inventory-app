{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white text-center">
                <h4>เข้าสู่ระบบ</h4>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('login') }}">
                    <div class="mb-3">
                        <label class="form-label">ชื่อผู้ใช้งาน (Username)</label>
                        <input type="text" name="username" class="form-control" required placeholder="admin / staff / customer">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">รหัสผ่าน (Password)</label>
                        <input type="password" name="password" class="form-control" required placeholder="123">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">เข้าสู่ระบบ</button>
                </form>
                <div class="text-center mt-3">
                    <small>ยังไม่มีบัญชีผู้ใช้? <a href="{{ url_for('register') }}">สมัครสมาชิกที่นี่</a></small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
